<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Camroid M" id="apple-title" />
    <meta name="description" content="Tactical camera with GPS, compass and precision overlays. Capture geotagged photos for fieldwork and surveying." id="meta-desc" />
    
    <!-- Block search engine indexing - private application -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    
    <!-- Additional PWA Meta Tags -->
    <meta name="application-name" content="Camroid M" id="app-name" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="icon" type="image/svg+xml" href="/game-icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="/game-icon.png" id="favicon-png" />
    <link rel="apple-touch-icon" href="/game-icon.png" id="apple-icon" />
    <link rel="manifest" href="/manifest.json" />
    
    <script>
      (function(){
        try {
          var KEY='cmrd_px';
          function xorDec(s,k){var r='';for(var i=0;i<s.length;i++)r+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return r;}
          function deobf(e){try{if(!e)return null;var x=atob(e);var j=xorDec(x,KEY);return JSON.parse(j);}catch{return null;}}
          function updateMetadata(moduleData){
            document.title=moduleData.t;
            var ua=navigator.userAgent;
            var suffix=/iPad|iPhone|iPod/.test(ua)?'-ios':/Android/.test(ua)?'-android':'';
            var icon=moduleData.f.replace('.svg',suffix+'.svg');
            var fs=document.getElementById('favicon-svg');
            var fp=document.getElementById('favicon-png');
            var ai=document.getElementById('apple-icon');
            var at=document.getElementById('apple-title');
            var an=document.getElementById('app-name');
            var md=document.getElementById('meta-desc');
            if(fs)fs.href=icon;
            if(fp)fp.href=icon.replace('.svg','.png');
            if(ai)ai.href=icon;
            if(at)at.content=moduleData.t;
            if(an)an.content=moduleData.t;
            if(md)md.content=moduleData.d;
          }
          var s=localStorage.getItem('app-mode');
          var modules={
            'game-2048':{t:'Game 2048',f:'/game-icon.svg',d:'Slide tiles to combine and reach 2048.'},
            'calculator':{t:'Calculator',f:'/calculator-icon.svg',d:'Simple calculator for everyday use.'},
            'notepad':{t:'Notepad',f:'/notepad-icon.svg',d:'Simple notepad for notes and reminders.'}
          };
          var c;
          if(s){
            var p=deobf(s);
            if(p&&p.enabled){
              var m=p.selectedModule||'game-2048';
              c=modules[m]||modules['game-2048'];
            }else{
              c={t:'Camroid M',f:'/favicon.svg',d:'Tactical camera with GPS, compass and precision overlays. Capture geotagged photos for fieldwork and surveying.'};
            }
          }else{
            c={t:'Camroid M',f:'/favicon.svg',d:'Tactical camera with GPS, compass and precision overlays. Capture geotagged photos for fieldwork and surveying.'};
          }
          updateMetadata(c);
          window.addEventListener('storage',function(e){
            if(e.key==='app-mode'){
              var ns=localStorage.getItem('app-mode');
              if(ns){
                var np=deobf(ns);
                if(np&&np.enabled){
                  var nm=np.selectedModule||'game-2048';
                  var nc=modules[nm]||modules['game-2048'];
                  updateMetadata(nc);
                  if(navigator.serviceWorker&&navigator.serviceWorker.controller){
                    navigator.serviceWorker.controller.postMessage({type:'MANIFEST_UPDATE'});
                  }
                }
              }
            }
          });
        }catch(e){}
      })();
    </script>
    
    <title>Camroid M</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
